name: Keep Portivex Alive

on:
  schedule:
    - cron: '0 6 */3 * *'  # Every 3 days at 6 AM UTC (11:30 AM IST)
  workflow_dispatch:         # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Portivex
        run: |
          echo "Pinging Portivex at $(date)"
          curl -L --max-time 60 --retry 3 --retry-delay 10 \
            -A "Mozilla/5.0" \
            https://portivex.streamlit.app/
          echo "Ping complete"
