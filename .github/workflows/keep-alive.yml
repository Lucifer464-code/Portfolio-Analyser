name: Keep Portivex Alive
on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours is plenty — Streamlit sleeps after ~12h idle
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Wake up Portivex
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              print("Opening Portivex...")
              page.goto("https://portivex.streamlit.app/",
                        wait_until="domcontentloaded", timeout=60000)
              # If the app is asleep, click the wake-up button
              try:
                  page.get_by_text("Yes, get this app back up").click(timeout=8000)
                  print("App was asleep — clicked wake button")
              except Exception:
                  print("No wake button — app already running")
              page.wait_for_timeout(20000)  # let the WebSocket session register
              print("Done — Streamlit session established")
              browser.close()
          EOF
